[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas"
version = "0.1.0"
description = "Atlas 个人信息聚合分析服务"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.13"
authors = [{name = "Atlas"}]
keywords = ["information-aggregation", "research", "news"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
]

# 依赖最小化：只声明当前保留代码（依赖闭包）真正需要的包。
# 新增依赖必须先说明用途，并确认无法用标准库或已有依赖解决。
dependencies = [
    # HTTP 客户端
    "requests>=2.31.0",
    "httpx>=0.25.0",
    # 解析（HTML / XML / RSS）
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "feedparser>=6.0.0",
    # 配置与校验
    "pydantic>=2.5.0",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    # 日志
    "loguru>=0.7.0",
    # 异步文件操作
    "aiofiles>=23.0.0",
    # 对象存储（原文归档后端之一）
    "minio>=7.2.20",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.version]
path = "src/atlas/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/config",
    "/docs",
    "/SPEC.md",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

# Ruff
[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long
    "B008",  # function call in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# Pytest（tests/ 由 T-002 起重建；此处暂不设 testpaths，避免空目录导致收集报错）
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
python_files = ["test_*.py", "*_test.py"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*", "*/.*"]
